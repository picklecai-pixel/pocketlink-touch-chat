<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掌上信箱</title><style>*{box-sizing:border-box}body{margin:auto;max-width:640px;padding:24px;background:#edf2ed;color:#17342d;font:16px/1.55 system-ui}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #33594d}h1{font-size:27px}button,input,textarea{font:inherit;padding:10px;border:1px solid #8ba399;border-radius:8px}button{background:#215848;color:white;cursor:pointer}input{width:8em}article{background:white;border-radius:12px;padding:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}article.mine{background:#d5eadd;margin-left:32px}small{display:block;color:#416255}img{max-width:100%;max-height:320px}textarea{width:100%;margin:12px 0}#log{height:50vh;overflow:auto}p{min-height:1em}:root{color-scheme:dark;--night:#101126;--ink:#f5f1e8;--mint:#81e4ce;--coral:#ff947d}html{min-height:100%;background:#101126}body{position:relative;background:transparent;color:var(--ink);padding:clamp(16px,4vw,32px);font-family:system-ui,sans-serif}#field{position:fixed;inset:0;width:100%;height:100%;z-index:-1}header{position:relative;overflow:hidden;background:#171831;border:1px solid #51536a;border-radius:18px;padding:16px 22px}header h1{letter-spacing:.12em;color:var(--mint)}#pair,main{background:#17182eef;padding:20px;border:1px solid #4c4d65;border-radius:16px;margin-top:18px}h2{font-size:20px}button{background:var(--mint);color:#13172a;font-weight:650;border:0;min-height:44px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--coral)}input,textarea{background:#101126;color:var(--ink);border-color:#676a83}article{background:#292b4a;color:var(--ink);border-left:3px solid var(--mint)}article.mine{background:#342737;border-color:var(--coral)}small{color:#bfbdd4}#status{color:var(--mint)}#change{background:#34344c;color:var(--ink)}#file{width:100%;margin-top:6px}
</style><canvas id="field" aria-hidden="true"></canvas><script>
function field(){const c=document.querySelector('#field'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;g.fillStyle='#101126';g.fillRect(0,0,c.width,c.height);for(let i=0;i<90;i++){g.beginPath();g.strokeStyle=i%5===0?'#ff947d66':'#81e4ce35';for(let x=-8;x<c.width+8;x+=6){const y=c.height*(.13+i/108)+Math.sin(x/112+i*.096)*44+Math.cos(x/168-i*.043)*53; if(x===-8)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}}field();addEventListener('resize',field);
</script><header><h1>掌上信箱</h1><button id="change" hidden>更换配对</button></header><section id="pair"><h2>连接 ESP</h2><button id="create">创建四位码</button> <input id="pin" inputmode="numeric" maxlength="4" placeholder="四位配对码"> <button id="join">加入</button></section><p id="status" role="status"></p><main hidden><div id="log"></div><textarea placeholder="写消息" id="msg"></textarea><button id="send">发送文字</button> <label>发送图片 <input id="file" type="file" accept="image/*"></label></main><script>
const el=id=>document.getElementById(id),main=document.querySelector('main');let session=JSON.parse(localStorage.chatSession||'null'),busy=false;
const db=new Promise((resolve,reject)=>{const r=indexedDB.open('touch-mail',1);r.onupgradeneeded=()=>r.result.createObjectStore('rooms');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function store(room,value){const d=await db;return new Promise((resolve,reject)=>{const t=d.transaction('rooms',value?'readwrite':'readonly'),s=t.objectStore('rooms'),r=value?s.put(value,room):s.get(room);t.oncomplete=()=>resolve(r.result);t.onerror=()=>reject(t.error)})}
let history=[],queue=[],chain=Promise.resolve();function save(){const room=session.room,data=structuredClone({history,queue});chain=chain.catch(()=>{}).then(()=>store(room,data));return chain}
async function api(path,opts={}){const r=await fetch(new URL(path,'https://pocketlink-touch-chat.picklecai.chatgpt.site'),{...opts,headers:{...opts.headers,Authorization:'Bearer '+(session?.token||'')}});if(!r.ok){const info=await r.json().catch(()=>({}));throw Error(info.error||'聊天服务无法访问（'+r.status+'）');}return r}
async function enter(){el('pair').hidden=true;el('change').hidden=false;main.hidden=false;const data=await store(session.room);history=data?.history||[];queue=data?.queue||[];paint();tick()}
function paint(){const log=el('log');log.replaceChildren();for(const m of [...history,...queue]){const a=document.createElement('article');if(m.role==='phone')a.className='mine';const tag=document.createElement('small');tag.textContent=(m.role==='phone'?'手机':'ESP')+(m.seq?'':' · 待发送');a.append(tag,document.createTextNode(m.body||''));if(m.blob){const img=new Image();const u=URL.createObjectURL(m.blob);img.onload=()=>URL.revokeObjectURL(u);img.src=u;a.append(img)}log.append(a)}log.scrollTop=log.scrollHeight}
async function pair(path){try{const pin=el('pin').value;if(path==='join'&&!/^\d{4}$/.test(pin))throw Error('请输入四位数字');session=await(await api('/'+path,{method:'POST',body:JSON.stringify({role:'phone',pin})})).json();localStorage.chatSession=JSON.stringify(session);await enter()}catch(e){el('status').textContent=e.message}}
async function tick(){if(!session||busy)return;busy=true;try{while(queue.length){const m=queue[0];await api('/messages?id='+m.id,{method:'POST',headers:{'Content-Type':m.blob?'image/jpeg':'text/plain'},body:m.blob||m.body});queue.shift();await save()}
const rows=await(await api('/messages?after='+(history.at(-1)?.seq||0))).json();for(const m of rows){if(m.photo)m.blob=await(await api('/image?id='+m.id)).blob();history.push(m);await save()}if(rows.length)paint();el('status').textContent=session.expiry>Date.now()?'配对码 '+session.pin+' · 请在 ESP 输入':'已连接服务'}catch{el('status').textContent='等待网络，消息已暂存'}finally{busy=false}}
async function enqueue(body,blob){queue.push({id:crypto.randomUUID().replaceAll('-',''),role:'phone',body,blob});await save();paint();tick()}
el('create').onclick=()=>pair('create');el('join').onclick=()=>pair('join');el('change').onclick=()=>{if(confirm('切换信箱？本机保留历史。')){delete localStorage.chatSession;location.reload()}};
el('send').onclick=async()=>{let s=el('msg').value.trim();if(!s)return;if(new TextEncoder().encode(s).length>280){el('status').textContent='消息最多 280 字节';return}await enqueue(s);el('msg').value=''};
el('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const im=await createImageBitmap(f,{imageOrientation:'from-image'}),c=document.createElement('canvas');let scale=Math.min(1,960/Math.max(im.width,im.height)),b;do{c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));scale*=.8}while(b.size>204800);im.close();await enqueue('',b)}catch{el('status').textContent='图片无法读取'}e.target.value=''};
if(session)enter();setInterval(tick,2500);
</script></html>
