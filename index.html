<script>
/* Pocket Link wire format v1. No pairing secret, message text or credentials in URLs. */
(() => {
  'use strict';
  const origin = 'https://ntfy.sh';
  const enc = new TextEncoder();
  const dec = new TextDecoder('utf-8', {fatal:true});
  const hex = a => [...a].map(n => n.toString(16).padStart(2,'0')).join('');
  const createKey = () => hex(crypto.getRandomValues(new Uint8Array(16)));
  const digest = async value => new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(value)));
  const idPattern = /^[a-f0-9]{32}$/;
  function validate(p, from) {
    return p && p.v === 1 && p.from === from && idPattern.test(p.id) &&
      Number.isSafeInteger(p.ts) && p.ts > 0 && p.ts <= 8640000000000000 &&
      ((p.kind === 'msg' && typeof p.text === 'string' && p.text.trim() &&
        enc.encode(p.text).length <= 280) || (p.kind === 'ack' && idPattern.test(p.ref)));
  }
  function b64(bytes) { return btoa(String.fromCharCode(...bytes)); }
  async function request(url, options, read) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 18000);
    try {
      const res = await fetch(url, { ...options, signal:controller.signal,
        mode:'cors', credentials:'omit', referrerPolicy:'no-referrer', cache:'no-store' });
      if (!res.ok) {
        const err = new Error(res.status === 429 ? '中转服务暂时限流，稍后重试。' : '中转服务暂不可用（'+res.status+'）。');
        err.status = res.status;
        throw err;
      }
      return await read(res);
    } finally { clearTimeout(timer); }
  }
  async function open(pairing, role='web') {
    if (!crypto.subtle) throw new Error('加密通讯需要 HTTPS，请打开正式网页。');
    const raw = String(pairing).replace(/[\s-]/g,'').toLowerCase();
    if (!idPattern.test(raw) || !['web','device'].includes(role)) throw new Error('配对码应为 32 位十六进制字符。');
    const peer = role === 'web' ? 'device' : 'web';
    const secret = await crypto.subtle.importKey('raw',await digest('pocketlink:key:v1:'+raw),'AES-GCM',false,['encrypt','decrypt']);
    const topic = 'pl1-'+hex(await digest('pocketlink:topic:v1:'+raw)).slice(0,32)+'-';
    const inbox = origin+'/'+topic+role;
    async function unpack(line) {
      if (line.event !== 'message' || line.topic !== topic+role || typeof line.message !== 'string' ||
          !line.message.startsWith('PL1.') || line.message.length > 3500) return null;
      try {
        const data = Uint8Array.from(atob(line.message.slice(4)), c => c.charCodeAt(0));
        if (data.length <= 28) return null;
        const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:data.subarray(0,12)},secret,data.subarray(12));
        const obj = JSON.parse(dec.decode(plain));
        return validate(obj,peer) ? obj : null;
      } catch { return null; }
    }
    async function send(p) {
      if (!validate(p,role)) throw new Error('消息内容或格式无效。');
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const crypt = await crypto.subtle.encrypt({name:'AES-GCM',iv},secret,enc.encode(JSON.stringify(p)));
      const data = new Uint8Array(12 + crypt.byteLength);
      data.set(iv); data.set(new Uint8Array(crypt),12);
      const response = await request(origin+'/'+topic+peer,{method:'POST',body:'PL1.'+b64(data)},r => r.json());
      if (!response.id || response.event !== 'message' || response.topic !== topic+peer) throw new Error('中转服务未确认接收。');
    }
    async function poll(cursor='') {
      // ntfy can replay other messages from the same second as a since=<id>
      // cursor. Preserve a small time overlap and the broker IDs committed in it.
      let newest = 0, known = new Map();
      if (cursor && cursor.startsWith('{')) {
        try {
          const c = JSON.parse(cursor);
          if (Number.isSafeInteger(c.t) && Array.isArray(c.ids)) {
            newest = c.t;
            known = new Map(c.ids);
          }
        } catch { /* Recover an old or incomplete checkpoint from the cache. */ }
      }
      const pos = newest > 5 ? String(newest-5) : 'all';
      return request(inbox+'/json?poll=1&since='+encodeURIComponent(pos),{},async res => {
        let changed = false; const messages = [];
        let remaining = '';
        async function consume(line) {
          if (!line.trim()) return;
          const obj = JSON.parse(line);
          if (obj.event !== 'message' || obj.topic !== topic+role || !obj.id) return;
          if (!Number.isSafeInteger(obj.time) || known.has(obj.id)) return;
          newest = Math.max(newest,obj.time);

          known.set(obj.id,obj.time);
          changed = true;
          const plain = await unpack(obj);
          if (plain) messages.push(plain);

        }
        const rd = res.body.getReader(), utf = new TextDecoder();
        for (;;) {
          const {done,value} = await rd.read();
          remaining += done ? utf.decode() : utf.decode(value,{stream:true});
          const lines = remaining.split('\n');
          remaining = lines.pop();
          for (const line of lines) await consume(line);
          if (done) break;
        }
        await consume(remaining);
        const checkpoint = changed ? JSON.stringify({t:newest,ids:[...known].filter(([,t])=>t>=newest-5)}) : cursor;
        return {messages,cursor:checkpoint};
      });
    }
    return {send,poll};
  }
  window.PagerRelay = {open,createKey};
})();

</script>

    const eph=await crypto.subtle.generateKey(p256,false,['deriveBits']);
    const shared=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:peer},eph.privateKey,256));
    const prefix=enc.encode('pocketlink:pair:v1:'), material=new Uint8Array(prefix.length+shared.length);
    material.set(prefix); material.set(shared,prefix.length);
    const aes=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',material),'AES-GCM',false,['encrypt']);
    shared.fill(0); material.fill(0);
    const pin=requestedPin || newPin(), exp=Math.floor(Date.now()/1000)+180;
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const box=await crypto.subtle.encrypt({name:'AES-GCM',iv,tagLength:128},aes,enc.encode(JSON.stringify({pin,key,exp})));
    const topic='pl4-'+hex(await crypto.subtle.digest('SHA-256',raw)).slice(0,32);
    const body=JSON.stringify({v:1,pub:hex(await crypto.subtle.exportKey('raw',eph.publicKey)),iv:hex(iv),box:hex(box)});
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),16000);
    try{
      const res=await fetch('https://ntfy.sh/'+topic,{method:'POST',headers:{'Content-Type':'text/plain'},body,
        mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store',signal:controller.signal});
      if(res.status===429) throw new Error('中转服务暂时限流，请稍后再试。');
      if(!res.ok) throw new Error('配对邀请发送失败，请检查网络后重试。');
      const receipt=await res.json();
      if(!receipt.id||receipt.event!=='message'||receipt.topic!==topic) throw new Error('中转服务未确认配对邀请，请重试。');
      if(Date.now()>=exp*1000) throw new Error('配对码已过期，请重新生成。');
      return {pin,exp};
    }catch(e){
      if(e.name==='AbortError'||e instanceof TypeError) throw new Error('暂时无法发送配对邀请，请检查网络后重试。');
      throw e;
    }finally{clearTimeout(timeout);}
  }
  window.PagerInvite={publish};
})();

</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const bytes = new TextEncoder();
  const keyFormat = /^[0-9a-f]{32}$/;
  const lastKey = 'pocket-link:active-v1';
  const normalPoll = 15000;
  const maxBackoff = 120000;
  const timeFormat = new Intl.DateTimeFormat('zh-CN', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
  });
  let current = null;
  let version = 0;
  let openingDb;
  const channel = typeof BroadcastChannel === 'function' ? new BroadcastChannel('pocket-link-v1') : null;

  function database() {
    if (openingDb) return openingDb;
    openingDb = new Promise((resolve, reject) => {
      const request = indexedDB.open('pocket-link-v1', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('boxes', {keyPath:'key'});
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    }).catch(error => { openingDb = null; throw error; });
    return openingDb;
  }
  async function roomState(key, change) {
    const db = await database();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('boxes', change ? 'readwrite' : 'readonly');
      const store = tx.objectStore('boxes');
      const get = store.get(key);
      let state;
      get.onsuccess = () => {
        state = get.result || {key, cursor:'', messages:[], outbox:[]};
        if (change) {
          change(state);
          store.put(state);
        }
      };
      tx.oncomplete = () => resolve(state);
      tx.onabort = tx.onerror = () => reject(tx.error || new Error('无法保存当前信箱。'));
    });
  }
  function active(s) { return s === current; }
  function remember(key) {
    try {
      if (key) localStorage.setItem(lastKey,key);
      else localStorage.removeItem(lastKey);
    } catch { /* A user can still reopen the inbox with its code. */ }
  }
  function setMessage(id,text) {
    const el = $(id);
    el.textContent = text;
    el.hidden = !text;
  }
  function setStatus(label,mode='') {
    $('status').dataset.mode = mode;
    $('status').lastElementChild.textContent = label;
  }
  function connection(s) {
    if (!active(s)) return;
    let text = '';
    if (!navigator.onLine) {
      setStatus('当前离线','error');
      text = '网络已断开。留言会保存在此，联网后自动发送。';
    } else if (s.diskError) {
      setStatus('存储不可用','error');
      text = '浏览器未能保存留言。请检查存储空间或浏览器权限后刷新。';
    } else if (s.receiveError || s.sendError) {
      setStatus('等待重连','error');
      text = (s.receiveError || s.sendError) + ' 留言已保留，会自动重试。';
    } else if (s.synced) {
      setStatus('收信中','ok');
    } else {
      setStatus('正在连接');
    }
    setMessage('connection',text);
  }
  function networkError(e) {
    return e && e.status === 429 ? '中转服务暂时限流。' : '暂时无法连接中转服务。';
  }
  function clearTimers(s) {
    if (!s) return;
    clearTimeout(s.pollTimer);
    clearTimeout(s.flushTimer);
    clearTimeout(s.copyTimer);
    clearInterval(s.pinTimer);
  }
  function settings(open) {
    $('pair-info').hidden = !open;
    $('pair-toggle').setAttribute('aria-expanded', String(open));
    if (!open) { $('copy-info').textContent=''; $('legacy-key').open=false; }
  }
  function welcome() {
    ++version;
    clearTimers(current);
    current = null;
    remember('');
    $('text').value = '';
    $('key-input').value = '';
    $('key-value').textContent = '';
    $('inbox').hidden = true;
    $('welcome').hidden = false;
    setMessage('welcome-error','');
    setStatus('尚未配对');
    $('recovery').open=false; $('create').focus();
  }
  async function enter(key, showKey) {
    const ticket = ++version;
    setMessage('welcome-error','');
    if (!keyFormat.test(key)) {
      setMessage('welcome-error','配对码由 32 位数字 0–9 和字母 a–f 组成。');
      $('key-input').focus();
      return;
    }
    try {
      const relay = await window.PagerRelay.open(key, 'web');
      const state = await roomState(key);
      if (version !== ticket) return;
      clearTimers(current);
      const s = current = {key,relay,visible:60,failures:0,flushBusy:false,pollBusy:false};
      $('welcome').hidden = true;
      $('inbox').hidden = false;
      $('text').value = '';
      $('key-input').value = '';
      $('short-key').textContent = '手机与ESP的往来留言';
      $('key-value').textContent='';
      $('legacy-key').open=false;
      setMessage('pin-note','');
      paintPin(s);
      $('copy-info').textContent = '';
      setMessage('compose-error','');
      settings(showKey);
      remember(key);
      updateComposer();
      render(s,state,true);
      connection(s);
      planPoll(s,0);
      planFlush(s,0);
      if (showKey) issuePin(s);
    } catch (e) {
      if (version === ticket) {
        setMessage('welcome-error',e.message && e.message.includes('HTTPS') ? e.message :
          '无法打开信箱。请使用支持本地存储的浏览器，并通过 HTTPS 打开。');
      }
    }
  }
  function make(kind, extra) {
    return {v:1,from:'web',kind,id:PagerRelay.createKey(),ts:Date.now(),...extra};
  }
  function addToOutbox(state,payload) {
    state.outbox.push({payload,tries:0,next:0,lease:0});
  }
  function saved(s) {
    channel?.postMessage({key:s.key});
  }
  async function refresh(s, scrollToEnd=false) {
    try {
      const state = await roomState(s.key);
      if (active(s)) render(s,state,scrollToEnd);
    } catch { s.diskError = true; connection(s); }
  }
  function updateComposer() {
    const text = $('text').value;
    const size = bytes.encode(text).length;
    $('byte-count').textContent = size + ' / 280 字节';
    $('byte-count').classList.toggle('too-long',size>280);
    $('text').setAttribute('aria-invalid',String(size>280));
    $('send').disabled = !text.trim() || size>280 || !!current?.composing;
    setMessage('compose-error',size>280 ? '留言超过 280 字节，请缩短后发送。' : '');
  }
  function node(tag,cls,text) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function render(s,state,scrollToEnd=false) {
    if (!active(s)) return;
    const list = $('messages'), panel = $('scroll');
    const nearEnd = panel.scrollHeight-panel.scrollTop-panel.clientHeight<62;
    const oldHeight = panel.scrollHeight;
    const messages = state.messages;
    // A successful poll may yield no new messages. Keep focus and scroll intact.
    const stamp = JSON.stringify([s.visible,messages.length,messages.slice(-s.visible).map(m=>[m.id,m.status])]);
    if (s.stamp === stamp) return;
    s.stamp = stamp;
    const fragment = document.createDocumentFragment();
    if(messages.length>s.visible) {
      const li=node('li'),more=node('button','text-button history-more','查看更早留言');
      more.onclick=()=>{ s.visible+=60; s.expanded=true; refresh(s); };
      li.append(more); fragment.append(li);
    }
    for (const msg of messages.slice(-s.visible)) {
      const ours=msg.from==='web';
      const li=node('li',ours?'letter ours':'letter');
      li.append(node('p',null,msg.text));
      const meta=node('div','meta');
      const sender=node('span',null,ours?'本机':'ESP32');
      const date=node('time',null,timeFormat.format(msg.ts));
      date.dateTime = new Date(msg.ts).toISOString();
      meta.append(sender,date);
      if (ours) {
        const labels={queued:'待发送',sent:'已发出 · 待回执',delivered:'ESP 已收到'};
        meta.append(node('span',null,labels[msg.status] || '待发送'));
        if(msg.status==='sent'){
          const retry=node('button','text-button','重发');
          retry.type='button';
          retry.setAttribute('aria-label','重新发送这条留言');
          retry.onclick=()=>resend(s,msg.id);
          meta.append(retry);
        }
      }
      li.append(meta); fragment.append(li);
    }
    list.replaceChildren(fragment);
    $('empty').hidden = !!messages.length;
    $('count').textContent = messages.length + ' 条';
    if (s.expanded) { panel.scrollTop += panel.scrollHeight-oldHeight; s.expanded=false; }
    else if(scrollToEnd || nearEnd) panel.scrollTop=panel.scrollHeight;
  }
  function planPoll(s,ms) {
    if (!active(s)) return;
    clearTimeout(s.pollTimer);
    s.pollTimer=setTimeout(()=>poll(s),ms);
  }
  async function poll(s) {
    if (!active(s) || s.pollBusy) return;
    if (!navigator.onLine) {connection(s);planPoll(s,normalPoll);return;}
    s.pollBusy=true;
    let delay=normalPoll;
    try {
      const start = await roomState(s.key);
      if (!active(s)) return;
      const batch = await s.relay.poll(start.cursor);
      if (!active(s)) return;
      if(batch.cursor!==start.cursor || batch.messages.length) {
        const next=await roomState(s.key, state=>{
          // Another tab may already have committed the same batch and cursor.
          if(state.cursor!==start.cursor) return;
          const seen=new Map(state.messages.map(m=>[m.id,m]));
          for(const item of batch.messages){
            if(item.from!=='device') continue;
            if(item.kind==='ack'){
              const ours=seen.get(item.ref);
              if(ours?.from==='web'){
                ours.status='delivered';
                state.outbox=state.outbox.filter(t=>t.payload.id!==item.ref);
              }
            }else if(item.kind==='msg'){
              if(!seen.has(item.id)){
                const msg={...item, status:'received'};
                state.messages.push(msg);
                seen.set(item.id,msg);
              }
              if(!state.outbox.some(t=>t.payload.kind==='ack' && t.payload.ref===item.id)){
                addToOutbox(state,make('ack',{ref:item.id}));
              }
            }
          }
          // Messages, outgoing receipts, and cursor advance in one transaction.
          state.cursor=batch.cursor;
        });
        if(!active(s)) return;
        render(s,next);
        saved(s);
        planFlush(s,0);
      }
      s.synced=true; s.failures=0; s.receiveError='';
    }catch(e){
      s.receiveError=networkError(e);
      delay=Math.min(maxBackoff,normalPoll*Math.pow(2,Math.min(4,s.failures++)));
    }finally{
      s.pollBusy=false;
      connection(s);
      if(active(s)) planPoll(s,delay);
    }
  }
  function planFlush(s,ms){
    if(!active(s) || s.flushBusy) return;
    clearTimeout(s.flushTimer);
    s.flushTimer=setTimeout(()=>flush(s),ms);
  }
  async function flush(s){
    if(!active(s)||s.flushBusy) return;
    if(!navigator.onLine){connection(s);planFlush(s,normalPoll);return;}
    s.flushBusy=true;
    let delay=normalPoll, claimed;
    try {
      // A short lease prevents two foreground tabs sending the same queued item concurrently.
      await roomState(s.key,state=>{
        const now=Date.now();
        if((state.nextSend||0)>now) {delay=state.nextSend-now; return;}
        const task=state.outbox.find(t=>Math.max(t.lease,t.next)<=now);
        if(!task) return;
        task.lease=now+25000;
        state.nextSend=now+5100;
        claimed=task.payload;
      });
      if(!claimed || !active(s)) return;
      let err;
      try { await s.relay.send(claimed); } catch(e) {err=e;}
      const state=await roomState(s.key,st=>{
        const index=st.outbox.findIndex(t=>t.payload.id===claimed.id);
        if(index===-1) return;
        if(err){
          const task=st.outbox[index];
          const wait=Math.min(maxBackoff,15000*2**Math.min(4,task.tries++));
          task.next=Date.now()+wait; task.lease=0;
          st.nextSend=Math.max(st.nextSend,task.next); delay=wait;
        }else{
          st.outbox.splice(index,1);
          const msg=st.messages.find(m=>m.id===claimed.id);
          if(msg && msg.status!=='delivered') msg.status='sent';
          delay=5100;
        }
      });
      if(!active(s)) return;
      s.sendError=err ? networkError(err) : '';
      render(s,state); saved(s);
    }catch{
      s.diskError=true;
    }finally{
      s.flushBusy=false; connection(s); planFlush(s,delay);
    }
  }
  async function send(){
    const s=current;
    const raw=$('text').value;
    if(!s||s.composing||!raw.trim()||bytes.encode(raw).length>280) return;
    s.composing=true; updateComposer();
    try{
      const p=make('msg',{text:raw});
      const state=await roomState(s.key,st=>{
        st.messages.push({...p,status:'queued'});
        addToOutbox(st,p);
      });
      if(!active(s)) return;
      if($('text').value===raw) $('text').value='';
      render(s,state,true); saved(s); planFlush(s,0);
      $('text').focus();
    }catch{ s.diskError=true; connection(s); }
    finally {s.composing=false;if(active(s)) updateComposer();}
  }
  async function resend(s,id){
    if(!active(s)) return;
    try{
      const state=await roomState(s.key,st=>{
        const m=st.messages.find(msg=>msg.id===id);
        if(m?.status!=='sent') return;
        const {status,...p}=m;
        m.status='queued';
        if(!st.outbox.some(t=>t.payload.id===id)) addToOutbox(st,p);
      });
      if(active(s)){render(s,state);saved(s);planFlush(s,0);}
    }catch{ s.diskError=true; connection(s); }
  }
  function paintPin(s) {
    if (!active(s)) return;
    const secs=s.invite?Math.ceil((s.invite.exp*1000-Date.now())/1000):0;
    const valid=secs>0;
    $('pair-pin').hidden=!valid;
    $('pair-pin').textContent=valid?s.invite.pin:'';
    $('issue-pin').hidden=valid;
    $('issue-pin').disabled=!!s.issuing;
    $('issue-pin').textContent=s.issuing?'正在生成…':'生成四位配对码';
    setMessage('pin-time',valid?'剩余 '+Math.floor(secs/60)+' 分 '+String(secs%60).padStart(2,'0')+' 秒':'');
    if(s.invite&&!valid){
      s.invite=null;
      clearInterval(s.pinTimer);
      setMessage('pin-note','配对码已过期，请重新生成。');
    }
  }
  async function issuePin(s) {
    if(!active(s)||s.issuing)return;
    if(s.invite&&s.invite.exp*1000>Date.now()){paintPin(s);return;}
    s.issuing=true;setMessage('pin-note','');paintPin(s);
    try {
      const invite=await PagerInvite.publish(s.key);
      if(!active(s))return;
      s.invite=invite;
      clearInterval(s.pinTimer);
      s.pinTimer=setInterval(()=>paintPin(s),1000);
    }catch(e){if(active(s))setMessage('pin-note',e.message||'生成失败，请重试。');}
    finally{s.issuing=false;if(active(s))paintPin(s);}
  }
  $('issue-pin').onclick=()=>{if(current)issuePin(current);};
  $('legacy-key').ontoggle=()=>{
    $('key-value').textContent=current&&$('legacy-key').open?current.key.match(/.{4}/g).join(' '):'';
  };
  document.addEventListener('visibilitychange',()=>{if(current&&!document.hidden)paintPin(current);});
  $('create').onclick=()=>{
    if(!window.PagerRelay){setMessage('welcome-error','未能载入通信组件，请刷新网页。');return;}
    enter(PagerRelay.createKey(),true);
  };
  $('device-form').onsubmit=async e=>{
    e.preventDefault();
    const pin=$('device-pin').value;
    if(!/^\d{4}$/.test(pin))return;
    const submit=e.currentTarget.querySelector('button');
    if(submit.disabled)return;
    submit.disabled=true;
    try{
      const key=PagerRelay.createKey();
      await PagerInvite.publish(key,pin);
      await enter(key,false);
      setMessage('compose-error','邀请已发送，请查看 ESP 上的配对结果。');
    }catch(err){setMessage('welcome-error',err.message||'无法发送邀请');}
    finally{submit.disabled=false;}
  };
  $('join-form').onsubmit=e=>{
    e.preventDefault();enter($('key-input').value.replace(/[\s-]/g,'').toLowerCase(),false);
  };
  $('pair-toggle').onclick=()=>settings($('pair-info').hidden);
  $('switch').onclick=welcome;
  $('copy').onclick=async ()=>{
    const s=current;if(!s) return;
    try{
      await navigator.clipboard.writeText(s.key);
      if(active(s)) $('copy-info').textContent='已复制配对码';
    }catch{
      if(!active(s)) return;
      const range=document.createRange();range.selectNodeContents($('key-value'));
      const selection=getSelection();selection.removeAllRanges();selection.addRange(range);
      $('copy-info').textContent='已选中配对码，请手动复制。';
    }
  };
  $('text').oninput=updateComposer;
  $('text').onkeydown=e=>{if(!e.isComposing && (e.metaKey || e.ctrlKey) && e.key==='Enter'){e.preventDefault();send();}};
  $('compose').onsubmit=e=>{e.preventDefault();send();};
  window.addEventListener('offline',()=>{if(current) connection(current);});
  window.addEventListener('online',()=>{if(current){connection(current);planPoll(current,0);planFlush(current,0);}});
  channel?.addEventListener('message',e=>{if(current?.key===e.data?.key) refresh(current);});
  let remembered;
  try{remembered=localStorage.getItem(lastKey);}catch{}
  if(remembered && keyFormat.test(remembered)) enter(remembered,false);
})();

</script>
